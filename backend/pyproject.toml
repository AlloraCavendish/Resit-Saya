# Purpose: Backend project definition and dependency specification for Resit Saya.
# Security: Pins direct dependencies to prevent supply-chain regressions and incompatibility.

[project]
name = "resit-saya-backend"
version = "1.0.0"
description = "Backend API for Resit Saya expense tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic[email]>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.2.0",
    "apscheduler>=3.10.4",
    "tzdata>=2024.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.3",
    "pip-audit>=2.7.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
