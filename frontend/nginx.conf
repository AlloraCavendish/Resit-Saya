# Purpose: Nginx web server configuration for serving the React SPA and reverse proxying /api to backend.
# Security: Enforces nosniff, HSTS, CSP, COOP, clickjacking protection, suppresses server tokens, sets 15M upload ceiling.

server {
    listen 80;
    server_name _;

    # Suppress Nginx version disclosure in Server header and error pages
    server_tokens off;

    # Maximum allowed file upload size
    client_max_body_size 15M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ─── Production Security Headers ───────────────────────────────────────
    # HSTS: Enforces HTTPS connections for 1 year including subdomains (CRITICAL)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: Restricts scripts, objects, frames, and resource origins (CRITICAL)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # Clickjacking protection: Prevents iframe embedding (IMPORTANT)
    add_header X-Frame-Options "DENY" always;

    # MIME-sniffing protection: Forces browser to honor declared Content-Type (IMPORTANT)
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy: Limits referrer leakage on cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy: Restricts unused browser features and hardware APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Cross-Origin Opener Policy: Isolates browsing context against XS-Leaks
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Domain policy and legacy XSS filter
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to FastAPI backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;

        # Strip upstream technology identification headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
